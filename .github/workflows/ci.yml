name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install` porque o package-lock.json ainda não foi atualizado depois que o
      # nodemon passou para devDependencies. Rode `npm install` localmente, commite o
      # lock e troque por `npm ci`.
      - run: npm install
      - run: npm test
